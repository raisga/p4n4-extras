name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # With every profile, so the extras it includes are checked too
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml --profile '*' config --quiet

      # .env.example isn't YAML: check it by letting Compose load it instead.
      - name: Lint YAML configs
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" docker-compose.yml */docker-compose.yml

      - name: Check .env.example loads in Compose
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Check .env.example completeness
        run: python3 scripts/check_env_example.py

      # The skeleton extra must stay valid on its own (its variables: check_env_example.py)
      - name: Validate the skeleton extra
        run: docker compose -f _template/docker-compose.yml --env-file _template/.env.example --profile '*' config --quiet
