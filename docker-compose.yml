# ====================================================================================
# p4n4-extras: optional services outside the core platform
# ====================================================================================
# Nothing here is part of p4n4's core (p4n4-iot, p4n4-ai), nothing starts by default,
# and no core service depends on anything here.
#
# Each extra is a directory of its own (<name>/docker-compose.yml, .env.example,
# config/, README.md), pulled into this one Compose project by `include:` below. Its
# service sits in a Compose profile of its own name: COMPOSE_PROFILES in .env lists
# the ones that start (empty: none). Add one by copying _template/ (see README.md).
# ====================================================================================

include: []
# include:
#   - my-extra/docker-compose.yml

services: {}

# ====================================================================================
# NETWORKS
# ====================================================================================
# Created by p4n4-iot (or `docker network create p4n4-net`); joined, never defined here
networks:
  p4n4-net:
    external: true
    name: p4n4-net
